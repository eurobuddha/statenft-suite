plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.eurobuddha.statenft'
    compileSdk 36

    defaultConfig {
        applicationId "com.eurobuddha.statenft"
        minSdk 28
        targetSdk 35
        versionCode 700
        versionName "0.7.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            // onnxruntime ships natives for every ABI; real handsets are
            // arm64 — shipping all four tripled the APK for no user
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        // Minima family release key. Credentials come from ~/.gradle/gradle.properties
        // (outside every repo), so nothing secret is ever committed. On a machine without
        // those props this config stays empty and release falls back to debug signing.
        release {
            def ksFile = project.findProperty('MINIMA_FAMILY_RELEASE_STORE_FILE')
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword project.findProperty('MINIMA_FAMILY_RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('MINIMA_FAMILY_RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('MINIMA_FAMILY_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // HELD at debug signing: the published catalog is debug-signed and a key change
            // forces every existing user to uninstall + reinstall. Flip to
            // signingConfigs.release as ONE deliberate fleet-wide migration.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        // jsch and jspecify both ship this OSGi metadata; neither is needed at runtime
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation files('libs/minimaapi.aar')
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'

    // SFTP for the Hosting feature — maintained JSch fork (modern KEX for
    // current OpenSSH; stock jcraft 0.1.55 cannot connect to Debian 12+)
    implementation 'com.github.mwiede:jsch:0.2.21'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    // real codecs for the raster-always-fits ladder test (native graphics)
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
